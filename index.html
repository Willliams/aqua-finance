<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финансы — чек</title>
<meta name="description" content="Учёт финансов в стиле кассового чека: быстрый ввод, счета, история, регулярные платежи">
<meta name="theme-color" content="#1c1b19">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Финансы">
<style>
  :root{
    --bg:#f2f1ec; --card:#ffffff; --text:#1c1b19; --muted:#6b6a63; --faint:#9a998f;
    --border:#d8d6cb; --accent:#1c1b19; --danger:#a32d2d; --success:#3b6d11;
    --radius:10px;
  }
  body.dark{
    --bg:#171614; --card:#211f1c; --text:#f2f1ec; --muted:#b0aea3; --faint:#77766c;
    --border:#39372f; --accent:#f2f1ec; --danger:#e07a7a; --success:#9ccf63;
  }
  body.eink{
    --bg:#ffffff; --card:#ffffff; --text:#000000; --muted:#000000; --faint:#333333;
    --border:#000000; --accent:#000000; --danger:#000000; --success:#000000; --radius:0px;
  }
  body.eink.dark{
    --bg:#000000; --card:#000000; --text:#ffffff; --muted:#ffffff; --faint:#cccccc;
    --border:#ffffff; --accent:#ffffff; --danger:#ffffff; --success:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    min-height:100vh; padding-bottom:70px;
  }
  .wrap{max-width:430px; margin:0 auto; padding:0 12px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:14px 12px 8px; max-width:430px; margin:0 auto;}
  header h1{font-size:15px; font-weight:600; margin:0; letter-spacing:0.5px;}
  header button{background:none; border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:6px 10px; font-family:inherit; font-size:12px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* Home */
  .toprow{display:flex; justify-content:space-between; align-items:center; padding:12px 14px 0;}
  .account-chip{font-size:12px; color:var(--muted); border:none; background:none; font-family:inherit; padding:0;}
  .balance-row{display:flex; justify-content:space-between; padding:10px 14px; margin:0 14px; border-top:1px dashed var(--border); border-bottom:1px dashed var(--border);}
  .balance-row > div{display:flex; flex-direction:column; gap:2px;}
  .balance-label{font-size:9px; color:var(--faint);}
  .balance-val{font-size:15px; font-weight:600; color:var(--text);}
  .seg{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); margin:10px 14px 0; padding:3px;}
  .seg > div{flex:1; text-align:center; padding:7px 0; font-size:12px; cursor:pointer; color:var(--muted);}
  .seg > div.active{background:var(--card); color:var(--text); font-weight:600; border-radius:calc(var(--radius) - 3px);}
  body.eink .seg > div.active{text-decoration:underline; text-underline-offset:3px; border:1px solid var(--text);}
  .amount-box{text-align:center; padding:14px 0 14px; margin:10px 14px 0; border-bottom:1px dashed var(--border);}
  .amount{font-size:34px; font-weight:600; letter-spacing:0.5px;}
  .amount.expense{color:var(--danger);}
  .amount.income{color:var(--success);}
  .amount-sub{font-size:10px; color:var(--faint); margin-top:2px;}
  .cats{display:flex; gap:8px; overflow-x:auto; padding:12px 14px; border-bottom:1px dashed var(--border);}
  .cat{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:52px; cursor:pointer;}
  .cat .ic{width:34px; height:34px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted);}
  .cat.active .ic{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .cat span{font-size:9px; color:var(--muted); text-align:center; line-height:1.2;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border);}
  .keypad button{background:var(--card); border:none; padding:15px 0; font-size:17px; color:var(--text); font-family:inherit;}
  .save-row{padding:12px 14px 16px;}
  .save-row button{width:100%; background:var(--accent); color:var(--bg); border:none; padding:13px 0; font-size:13px; font-weight:600; border-radius:var(--radius); font-family:inherit;}
  .reminder{margin:10px 14px 0; padding:10px 12px; border:1px dashed var(--border); border-radius:var(--radius); font-size:11px;}
  .reminder .rbtns{display:flex; gap:8px; margin-top:8px;}
  .reminder button{flex:1; font-size:11px; padding:6px 0; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:var(--radius); font-family:inherit;}

  /* Lists */
  .section-title{display:flex; justify-content:space-between; align-items:baseline; margin:14px 2px 8px; font-size:12px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px dashed var(--border); font-size:12px;}
  .row:last-child{border-bottom:none;}
  .row .left{display:flex; align-items:center; gap:10px;}
  .row .name{font-size:12px;}
  .row .sub{font-size:9px; color:var(--faint);}
  .row .val{font-weight:600; font-size:13px;}
  .val.expense{color:var(--danger);} .val.income{color:var(--success);}
  .addbtn{width:100%; margin-top:12px; padding:10px 0; font-size:11px; border:1px dashed var(--border); background:none; color:var(--muted); border-radius:var(--radius); font-family:inherit;}
  .chips{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .chip{font-size:10px; padding:5px 11px; border-radius:20px; border:1px solid var(--border); color:var(--muted); cursor:pointer;}
  .chip.active{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .date-label{font-size:9px; color:var(--faint); margin:12px 0 4px;}
  .total-row{display:flex; justify-content:space-between; padding-top:10px; margin-top:8px; border-top:1px dashed var(--border); font-size:11px; font-weight:600;}
  .receipt-icon{font-size:9px; border:1px solid var(--border); border-radius:3px; padding:1px 4px; color:var(--muted); cursor:pointer;}
  .cat-bar-row{margin-bottom:8px;}
  .cat-bar-top{display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px;}
  .cat-bar-track{height:4px; background:var(--bg); border-radius:2px; overflow:hidden;}
  .cat-bar-fill{height:100%; background:var(--accent);}

  /* Nav */
  nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; max-width:430px; margin:0 auto;}
  nav button{flex:1; background:none; border:none; padding:11px 0 9px; font-family:inherit; font-size:9px; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav button.active{color:var(--text); font-weight:600;}
  nav .dot{width:5px; height:5px; border-radius:50%; background:transparent;}
  nav button.active .dot{background:var(--text);}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.open{display:flex;}
  .sheet{background:var(--card); width:100%; max-width:430px; border-radius:14px 14px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;}
  .sheet h2{font-size:14px; margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:10px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); font-family:inherit; font-size:12px;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}
  .sheet-actions{display:flex; gap:8px; margin-top:14px;}
  .sheet-actions button{flex:1; padding:11px 0; border-radius:var(--radius); font-family:inherit; font-size:12px; border:1px solid var(--border); background:var(--card); color:var(--text);}
  .sheet-actions button.primary{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .close-x{position:absolute; top:12px; right:16px; background:none; border:none; font-size:16px; color:var(--muted);}
  .sheet{position:relative;}
  .switch-row{display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:8px 0;}
  img.receipt-preview{max-width:100%; border-radius:var(--radius); margin-top:8px; border:1px solid var(--border);}
</style>
</head>
<body>

<header>
  <h1>ФИНАНСЫ · ЧЕК</h1>
  <button id="settingsBtn">⚙ настройки</button>
</header>

<div class="wrap">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="card">
      <div class="toprow">
        <button class="account-chip" id="accountChip">Счёт ▾</button>
        <span style="font-size:10px; color:var(--faint);" id="todayLabel"></span>
      </div>
      <div class="balance-row">
        <div><span class="balance-label">баланс счёта</span><span class="balance-val" id="accBalance">0 ₽</span></div>
        <div style="text-align:right;"><span class="balance-label">всего</span><span class="balance-val" id="totalBalance">0 ₽</span></div>
      </div>
      <div class="seg">
        <div class="active" data-mode="expense">Расход</div>
        <div data-mode="income">Доход</div>
      </div>
      <div class="amount-box">
        <div class="amount expense" id="amountDisplay">0 ₽</div>
        <div class="amount-sub" id="amountNote">сегодня</div>
      </div>
      <div class="cats" id="catsRow"></div>
      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k=",">,</button><button data-k="0">0</button><button data-k="back">⌫</button>
      </div>
      <div class="save-row" style="display:flex; gap:8px; padding:12px 14px 16px;">
        <button id="attachReceiptBtn" style="flex:0 0 auto; width:44px; padding:13px 0; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:var(--radius); font-family:inherit;">🧾</button>
        <button id="saveBtn" style="flex:1; background:var(--accent); color:var(--bg); border:none; padding:13px 0; font-size:13px; font-weight:600; border-radius:var(--radius); font-family:inherit;">Записать</button>
      </div>
      <div id="receiptPreviewRow" style="display:none; padding:0 14px 14px; font-size:10px; color:var(--muted);"></div>
      <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none;">
    </div>
    <div id="remindersBox"></div>
  </section>

  <!-- ACCOUNTS -->
  <section class="screen" id="screen-accounts">
    <div class="section-title"><span>Счета</span><span id="accountsTotal" style="color:var(--faint); font-size:10px;"></span></div>
    <div class="card" style="padding:4px 14px;" id="accountsList"></div>
    <button class="addbtn" id="addAccountBtn">+ добавить счёт</button>
  </section>

  <!-- HISTORY -->
  <section class="screen" id="screen-history">
    <div class="chips" id="periodFilters">
      <div class="chip" data-p="today">Сегодня</div>
      <div class="chip" data-p="week">Неделя</div>
      <div class="chip active" data-p="month">Месяц</div>
      <div class="chip" data-p="year">Год</div>
      <div class="chip" data-p="all">Всё время</div>
      <div class="chip" data-p="custom">Период ▾</div>
    </div>

    <div class="card" style="padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:2px;"><span class="balance-label">доход</span><span class="balance-val" style="color:var(--success);" id="periodIncome">0 ₽</span></div>
      <div style="display:flex; flex-direction:column; gap:2px;"><span class="balance-label">расход</span><span class="balance-val" style="color:var(--danger);" id="periodExpense">0 ₽</span></div>
      <div style="display:flex; flex-direction:column; gap:2px; text-align:right;"><span class="balance-label">итого</span><span class="balance-val" id="periodNet">0 ₽</span></div>
    </div>

    <div class="card" style="padding:10px 14px; margin-bottom:12px;" id="categoryBreakdownCard">
      <div class="section-title" style="margin:0 0 4px;"><span>Расходы по категориям</span></div>
      <div id="categoryBreakdown"></div>
    </div>

    <div class="chips" id="historyFilters">
      <div class="chip active" data-f="all">Все</div>
      <div class="chip" data-f="income">Доход</div>
      <div class="chip" data-f="expense">Расход</div>
      <div class="chip" data-f="receipts">С чеками</div>
      <div class="chip" data-f="recurring">Регулярные</div>
    </div>
    <div class="card" style="padding:2px 14px 14px;" id="historyList"></div>
  </section>

  <!-- RECURRING -->
  <section class="screen" id="screen-recurring">
    <div class="section-title"><span>Регулярные платежи</span></div>
    <div class="card" style="padding:12px 14px; margin-bottom:12px;">
      <div style="font-size:10px; color:var(--muted);">Списания в этом месяце</div>
      <div style="font-size:22px; font-weight:600; color:var(--danger);" id="plannedTotal">0 ₽</div>
    </div>
    <div class="card" style="padding:4px 14px;" id="recurringList"></div>
    <button class="addbtn" id="addRuleBtn">+ добавить регулярный платёж</button>
  </section>

</div>

<nav>
  <button class="active" data-screen="home"><span class="dot"></span>Главная</button>
  <button data-screen="accounts"><span class="dot"></span>Счета</button>
  <button data-screen="history"><span class="dot"></span>История</button>
  <button data-screen="recurring"><span class="dot"></span>Регулярные</button>
</nav>

<!-- Sheets / modals -->
<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>

<script>
/* ---------- state ---------- */
const KEY = 'financeAppState_v1';
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }

function defaultState(){
  return {
    accounts: [ {id:'a_cash', name:'Наличные', type:'cash', balance:0} ],
    categories: [
      {id:'c1',name:'Продукты',type:'expense'},{id:'c2',name:'Транспорт',type:'expense'},
      {id:'c3',name:'Кафе',type:'expense'},{id:'c4',name:'Дом',type:'expense'},
      {id:'c5',name:'Развлечения',type:'expense'},{id:'c6',name:'Другое',type:'expense'},
      {id:'i1',name:'Зарплата',type:'income'},{id:'i2',name:'Подработка',type:'income'},
      {id:'i3',name:'Перевод',type:'income'},{id:'i4',name:'Подарок',type:'income'},
      {id:'i5',name:'Другое',type:'income'}
    ],
    transactions: [],
    recurringRules: [],
    dueReminders: [],
    settings: { activeAccountId:'a_cash', theme:'light', style:'receipt' }
  };
}
function loadState(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const s = defaultState(); saveState(s); return s;
}
function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

let state = loadState();
let ui = { mode:'expense', amountStr:'0', categoryId: null, receiptDataUrl: null };

/* ---------- recurring logic ---------- */
function addPeriod(dateStr, rule){
  const d = new Date(dateStr+'T00:00:00');
  const n = rule.interval || 1;
  if(rule.frequency==='daily') d.setDate(d.getDate()+n);
  else if(rule.frequency==='weekly') d.setDate(d.getDate()+7*n);
  else if(rule.frequency==='monthly') d.setMonth(d.getMonth()+n);
  else if(rule.frequency==='yearly') d.setFullYear(d.getFullYear()+n);
  else if(rule.frequency==='custom') d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function createTxFromRule(rule, dateStr){
  const tx = { id:uid(), accountId:rule.accountId, categoryId:rule.categoryId, type:rule.type,
    amount:rule.amount, date:dateStr, note:rule.note||'', recurringRuleId:rule.id };
  state.transactions.unshift(tx);
  const acc = state.accounts.find(a=>a.id===rule.accountId);
  if(acc) acc.balance += (rule.type==='income'? rule.amount : -rule.amount);
}
function processRecurring(){
  const today = todayStr();
  state.recurringRules.forEach(rule=>{
    if(!rule.active) return;
    let guard=0;
    while(rule.nextDate <= today && guard<50){
      guard++;
      if(rule.autoApply){
        createTxFromRule(rule, rule.nextDate);
        rule.nextDate = addPeriod(rule.nextDate, rule);
      } else {
        if(!state.dueReminders.includes(rule.id)) state.dueReminders.push(rule.id);
        break;
      }
    }
  });
  saveState(state);
}
processRecurring();

/* ---------- render: home ---------- */
function renderHome(){
  const acc = state.accounts.find(a=>a.id===state.settings.activeAccountId) || state.accounts[0];
  document.getElementById('accountChip').textContent = (acc? acc.name : '—') + ' ▾';
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'long'});
  document.getElementById('accBalance').textContent = fmt(acc? acc.balance : 0) + ' ₽';
  document.getElementById('totalBalance').textContent = fmt(state.accounts.reduce((s,a)=>s+a.balance,0)) + ' ₽';

  const amt = document.getElementById('amountDisplay');
  const value = parseFloat(ui.amountStr.replace(',','.')) || 0;
  amt.textContent = (ui.mode==='expense'?'− ':'+ ') + fmt(value) + ' ₽';
  amt.className = 'amount ' + ui.mode;

  const cats = state.categories.filter(c=>c.type===ui.mode);
  if(!ui.categoryId || !cats.find(c=>c.id===ui.categoryId)) ui.categoryId = cats[0] ? cats[0].id : null;
  const row = document.getElementById('catsRow');
  row.innerHTML = cats.map(c=>`
    <div class="cat ${c.id===ui.categoryId?'active':''}" data-cat="${c.id}">
      <div class="ic">${c.name.slice(0,2).toUpperCase()}</div>
      <span>${c.name}</span>
    </div>`).join('') + `
    <div class="cat" data-action="addCategory">
      <div class="ic">+</div><span>Категория</span>
    </div>`;

  renderReminders();
}
function renderReminders(){
  const box = document.getElementById('remindersBox');
  if(!state.dueReminders.length){ box.innerHTML=''; return; }
  box.innerHTML = state.dueReminders.map(rid=>{
    const rule = state.recurringRules.find(r=>r.id===rid);
    if(!rule) return '';
    const cat = state.categories.find(c=>c.id===rule.categoryId);
    const label = rule.note ? rule.note : (cat?cat.name:'Платёж');
    return `<div class="reminder">
      <div>Наступил срок: <b>${label}</b>, ${fmt(rule.amount)} ₽</div>
      <div class="rbtns">
        <button data-action="confirmRule" data-id="${rule.id}">Провести</button>
        <button data-action="skipRule" data-id="${rule.id}">Отложить</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- render: accounts ---------- */
function renderAccounts(){
  const total = state.accounts.reduce((s,a)=>s+a.balance,0);
  document.getElementById('accountsTotal').textContent = 'итого ' + fmt(total) + ' ₽';
  document.getElementById('accountsList').innerHTML = state.accounts.map(a=>`
    <div class="row">
      <div class="left"><div><div class="name">${a.name}</div><div class="sub">${a.type==='cash'?'наличные':'карта'}</div></div></div>
      <span class="val">${fmt(a.balance)} ₽</span>
    </div>`).join('');
}

/* ---------- render: history ---------- */
let historyFilter = 'all';
let historyPeriod = { type: 'month' };
function pad2(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function computeRange(period){
  const today = new Date();
  if(period.type==='today'){ return {from: dstr(today), to: dstr(today)}; }
  if(period.type==='week'){ const from = new Date(today); from.setDate(from.getDate()-6); return {from: dstr(from), to: dstr(today)}; }
  if(period.type==='month'){ const from = new Date(today.getFullYear(), today.getMonth(), 1); return {from: dstr(from), to: dstr(today)}; }
  if(period.type==='year'){ const from = new Date(today.getFullYear(),0,1); return {from: dstr(from), to: dstr(today)}; }
  if(period.type==='custom'){ return {from: period.from, to: period.to}; }
  return {from:null, to:null};
}
function renderHistory(){
  const range = computeRange(historyPeriod);
  let periodTxs = [...state.transactions];
  if(range.from) periodTxs = periodTxs.filter(t=> t.date >= range.from && t.date <= range.to);

  const income = periodTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = periodTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('periodIncome').textContent = fmt(income) + ' ₽';
  document.getElementById('periodExpense').textContent = fmt(expense) + ' ₽';
  const netEl = document.getElementById('periodNet');
  netEl.textContent = (income-expense>=0?'+':'') + fmt(income-expense) + ' ₽';
  netEl.style.color = (income-expense>=0) ? 'var(--success)' : 'var(--danger)';

  const byCat = {};
  periodTxs.filter(t=>t.type==='expense').forEach(t=>{
    byCat[t.categoryId] = (byCat[t.categoryId]||0) + t.amount;
  });
  const sortedCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCat = sortedCats.length ? sortedCats[0][1] : 1;
  document.getElementById('categoryBreakdown').innerHTML = sortedCats.length ? sortedCats.map(([cid,sum])=>{
    const cat = state.categories.find(c=>c.id===cid);
    const pct = Math.round((sum/maxCat)*100);
    return `<div class="cat-bar-row">
      <div class="cat-bar-top"><span>${cat?cat.name:'—'}</span><span>${fmt(sum)} ₽</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join('') : `<div style="font-size:11px; color:var(--faint); padding:6px 0;">Нет расходов за период</div>`;

  let txs = periodTxs.sort((a,b)=> b.date.localeCompare(a.date));
  if(historyFilter==='income') txs = txs.filter(t=>t.type==='income');
  if(historyFilter==='expense') txs = txs.filter(t=>t.type==='expense');
  if(historyFilter==='receipts') txs = txs.filter(t=>t.receiptUrl);
  if(historyFilter==='recurring') txs = txs.filter(t=>t.recurringRuleId);

  const groups = {};
  txs.forEach(t=>{ (groups[t.date] = groups[t.date]||[]).push(t); });

  let html = '';
  let total = 0;
  Object.keys(groups).forEach(date=>{
    html += `<div class="date-label">${new Date(date+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'long'})}</div>`;
    groups[date].forEach(t=>{
      const cat = state.categories.find(c=>c.id===t.categoryId);
      const rule = t.recurringRuleId ? state.recurringRules.find(r=>r.id===t.recurringRuleId) : null;
      const rowLabel = (rule && rule.note) ? rule.note : (cat?cat.name:'—');
      total += (t.type==='income'? t.amount : -t.amount);
      html += `<div class="row">
        <div class="left"><span class="name">${rowLabel}${t.recurringRuleId?' <span class="sub">(регулярный)</span>':''}</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${t.receiptUrl?`<span class="receipt-icon" data-action="viewReceipt" data-id="${t.id}">чек</span>`:''}
          <span class="val ${t.type}">${t.type==='income'?'+':'−'} ${fmt(t.amount)} ₽</span>
          <span class="receipt-icon" data-action="deleteTx" data-id="${t.id}" style="border-color:var(--danger); color:var(--danger);">✕</span>
        </div>
      </div>`;
    });
  });
  if(!txs.length) html = `<div style="padding:20px 0; text-align:center; color:var(--faint); font-size:11px;">Пока нет операций</div>`;
  else html += `<div class="total-row"><span>ИТОГО ЗА ПЕРИОД</span><span>${total>=0?'+':''}${fmt(total)} ₽</span></div>`;
  document.getElementById('historyList').innerHTML = html;
}

/* ---------- render: recurring ---------- */
function renderRecurring(){
  const monthNow = todayStr().slice(0,7);
  let planned = 0;
  state.recurringRules.filter(r=>r.active && r.type==='expense' && r.nextDate.slice(0,7)===monthNow)
    .forEach(r=> planned += r.amount);
  document.getElementById('plannedTotal').textContent = fmt(planned) + ' ₽';

  const freqLabel = {daily:'ежедневно', weekly:'еженедельно', monthly:'ежемесячно', yearly:'ежегодно', custom:'произвольно'};
  document.getElementById('recurringList').innerHTML = state.recurringRules.map(r=>{
    const cat = state.categories.find(c=>c.id===r.categoryId);
    const label = r.note ? r.note : (cat?cat.name:'—');
    return `<div class="row">
      <div class="left"><div><div class="name">${label}${r.note && cat?` <span class="sub">· ${cat.name}</span>`:''}</div><div class="sub">${freqLabel[r.frequency]||r.frequency} · след. ${r.nextDate}</div></div></div>
      <span class="val ${r.type}">${r.type==='income'?'+':'−'} ${fmt(r.amount)} ₽</span>
    </div>`;
  }).join('') || `<div style="padding:16px 0; text-align:center; color:var(--faint); font-size:11px;">Нет регулярных платежей</div>`;
}

/* ---------- nav ---------- */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=> s.classList.toggle('active', s.id==='screen-'+name));
  document.querySelectorAll('nav button').forEach(b=> b.classList.toggle('active', b.dataset.screen===name));
  if(name==='home') renderHome();
  if(name==='accounts') renderAccounts();
  if(name==='history') renderHistory();
  if(name==='recurring') renderRecurring();
}
document.querySelectorAll('nav button').forEach(b=> b.addEventListener('click', ()=> showScreen(b.dataset.screen)));

/* ---------- home interactions ---------- */
document.querySelectorAll('.seg > div').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('.seg > div').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    ui.mode = el.dataset.mode; ui.categoryId = null; ui.amountStr='0';
    renderHome();
  });
});
document.getElementById('keypad').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  const k = btn.dataset.k;
  if(k==='back') ui.amountStr = ui.amountStr.length>1 ? ui.amountStr.slice(0,-1) : '0';
  else if(k===','){ if(!ui.amountStr.includes(',')) ui.amountStr += ','; }
  else { ui.amountStr = ui.amountStr==='0' ? k : ui.amountStr + k; }
  renderHome();
});
document.getElementById('catsRow').addEventListener('click', e=>{
  const addBtn = e.target.closest('[data-action="addCategory"]');
  if(addBtn){ openAddCategory(); return; }
  const el = e.target.closest('.cat[data-cat]'); if(!el) return;
  ui.categoryId = el.dataset.cat; renderHome();
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const value = parseFloat(ui.amountStr.replace(',','.')) || 0;
  if(value<=0 || !ui.categoryId) return;
  const acc = state.accounts.find(a=>a.id===state.settings.activeAccountId) || state.accounts[0];
  const tx = { id:uid(), accountId:acc.id, categoryId:ui.categoryId, type:ui.mode, amount:value, date:todayStr(), note:'', receiptUrl: ui.receiptDataUrl || null };
  state.transactions.unshift(tx);
  acc.balance += (ui.mode==='income'? value : -value);
  ui.amountStr='0'; ui.receiptDataUrl=null;
  document.getElementById('receiptPreviewRow').style.display='none';
  saveState(state); renderHome();
});
document.getElementById('attachReceiptBtn').addEventListener('click', ()=>{
  document.getElementById('receiptInput').click();
});
document.getElementById('receiptInput').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    ui.receiptDataUrl = reader.result;
    const row = document.getElementById('receiptPreviewRow');
    row.style.display = 'block';
    row.textContent = 'Чек прикреплён: ' + file.name;
  };
  reader.readAsDataURL(file);
});
document.getElementById('accountChip').addEventListener('click', openAccountPicker);
function openAccountPicker(){
  const rows = state.accounts.map(a=>`
    <div class="row" data-action="selectAccount" data-id="${a.id}" style="cursor:pointer;">
      <div class="left"><div><div class="name">${a.name}</div><div class="sub">${a.type==='cash'?'наличные':'карта'}</div></div></div>
      <span class="val">${fmt(a.balance)} ₽</span>
    </div>`).join('');
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Выбрать счёт</h2>
    <div>${rows}</div>
    <div class="sheet-actions">
      <button class="primary" data-action="openAddAccount">+ добавить счёт</button>
    </div>`);
}
document.getElementById('remindersBox').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-action]'); if(!btn) return;
  const rule = state.recurringRules.find(r=>r.id===btn.dataset.id);
  if(!rule) return;
  if(btn.dataset.action==='confirmRule'){ createTxFromRule(rule, todayStr()); }
  rule.nextDate = addPeriod(rule.nextDate, rule);
  state.dueReminders = state.dueReminders.filter(id=>id!==rule.id);
  saveState(state); renderHome();
});

/* ---------- accounts interactions ---------- */
document.getElementById('addAccountBtn').addEventListener('click', openAddAccountForm);
function openAddAccountForm(){
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Добавить счёт</h2>
    <div class="field"><label>Название</label><input id="f_name" placeholder="например, Тинькофф Блэк"></div>
    <div class="field"><label>Тип</label>
      <select id="f_type"><option value="card">Карта</option><option value="cash">Наличные</option></select>
    </div>
    <div class="field"><label>Начальный баланс</label><input id="f_balance" type="number" value="0"></div>
    <div class="sheet-actions">
      <button data-action="close">Отмена</button>
      <button class="primary" data-action="saveAccount">Добавить</button>
    </div>`);
}

/* ---------- history interactions ---------- */
document.getElementById('historyFilters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('#historyFilters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active'); historyFilter = chip.dataset.f; renderHistory();
});
document.getElementById('periodFilters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  const p = chip.dataset.p;
  if(p==='custom'){ openCustomPeriodForm(); return; }
  document.querySelectorAll('#periodFilters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active'); historyPeriod = { type:p }; renderHistory();
});
function openCustomPeriodForm(){
  const range = computeRange(historyPeriod.type==='custom' ? historyPeriod : {type:'month'});
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Свой период</h2>
    <div class="field-row">
      <div class="field"><label>С</label><input id="p_from" type="date" value="${range.from||''}"></div>
      <div class="field"><label>По</label><input id="p_to" type="date" value="${range.to||todayStr()}"></div>
    </div>
    <div class="sheet-actions">
      <button data-action="close">Отмена</button>
      <button class="primary" data-action="applyCustomPeriod">Показать</button>
    </div>`);
}
document.getElementById('historyList').addEventListener('click', e=>{
  const receiptEl = e.target.closest('[data-action="viewReceipt"]');
  if(receiptEl){
    const tx = state.transactions.find(t=>t.id===receiptEl.dataset.id); if(!tx || !tx.receiptUrl) return;
    openSheet(`<button class="close-x" data-action="close">✕</button><h2>Чек</h2><img class="receipt-preview" src="${tx.receiptUrl}">`);
    return;
  }
  const delEl = e.target.closest('[data-action="deleteTx"]');
  if(delEl){
    const tx = state.transactions.find(t=>t.id===delEl.dataset.id); if(!tx) return;
    if(!confirm('Отменить эту операцию?')) return;
    const acc = state.accounts.find(a=>a.id===tx.accountId);
    if(acc) acc.balance -= (tx.type==='income'? tx.amount : -tx.amount);
    state.transactions = state.transactions.filter(t=>t.id!==tx.id);
    saveState(state); renderHistory(); renderAccounts(); renderHome();
    return;
  }
});

/* ---------- recurring interactions ---------- */
document.getElementById('addRuleBtn').addEventListener('click', ()=> openAddRule());
function openAddRule(){
  const catsOptions = () => state.categories.map(c=>`<option value="${c.id}" data-type="${c.type}">${c.name} (${c.type==='income'?'доход':'расход'})</option>`).join('');
  const accOptions = state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Регулярный платёж</h2>
    <div class="field"><label>Название (свой ярлык)</label><input id="r_note" placeholder="например, Netflix, Аренда"></div>
    <div class="field"><label>Тип</label>
      <select id="r_type"><option value="expense">Расход</option><option value="income">Доход</option></select>
    </div>
    <div class="field"><label>Категория</label><select id="r_cat">${catsOptions()}</select></div>
    <div class="field"><label>Счёт</label><select id="r_acc">${accOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Сумма</label><input id="r_amount" type="number" placeholder="0"></div>
      <div class="field"><label>Периодичность</label>
        <select id="r_freq">
          <option value="daily">Ежедневно</option>
          <option value="weekly">Еженедельно</option>
          <option value="monthly" selected>Ежемесячно</option>
          <option value="yearly">Ежегодно</option>
          <option value="custom">Каждые N дней</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Интервал</label><input id="r_interval" type="number" value="1" min="1"></div>
      <div class="field"><label>Дата начала</label><input id="r_start" type="date" value="${todayStr()}"></div>
    </div>
    <div class="switch-row"><span>Списывать автоматически (иначе — напоминание)</span><input type="checkbox" id="r_auto"></div>
    <div class="sheet-actions">
      <button data-action="close">Отмена</button>
      <button class="primary" data-action="saveRule">Сохранить</button>
    </div>`);
}
document.getElementById('recurringList').addEventListener('click', ()=>{});

/* ---------- add category ---------- */
function openAddCategory(){
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Новая категория</h2>
    <div class="field"><label>Название</label><input id="cat_name" placeholder="например, Спорт"></div>
    <div class="field"><label>Тип</label>
      <select id="cat_type"><option value="${ui.mode}">${ui.mode==='expense'?'Расход':'Доход'}</option><option value="${ui.mode==='expense'?'income':'expense'}">${ui.mode==='expense'?'Доход':'Расход'}</option></select>
    </div>
    <div class="sheet-actions">
      <button data-action="close">Отмена</button>
      <button class="primary" data-action="saveCategory">Добавить</button>
    </div>`);
}

/* ---------- settings sheet ---------- */
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  openSheet(`
    <button class="close-x" data-action="close">✕</button>
    <h2>Настройки</h2>
    <div class="switch-row"><span>Тёмная тема</span><input type="checkbox" id="s_dark" ${state.settings.theme==='dark'?'checked':''}></div>
    <div class="switch-row"><span>Стиль e-ink</span><input type="checkbox" id="s_eink" ${state.settings.style==='eink'?'checked':''}></div>
    <div class="sheet-actions">
      <button data-action="exportData">Экспорт данных</button>
      <button data-action="importData">Импорт данных</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="sheet-actions">
      <button class="primary" data-action="applySettings">Готово</button>
    </div>`);
});

/* ---------- generic sheet handling ---------- */
function openSheet(html){
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});
document.getElementById('sheetContent').addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const action = btn.dataset.action;

  if(action==='close') closeSheet();

  if(action==='selectAccount'){
    state.settings.activeAccountId = btn.dataset.id;
    saveState(state); closeSheet(); renderHome();
  }

  if(action==='openAddAccount'){
    openAddAccountForm();
  }

  if(action==='applyCustomPeriod'){
    const from = document.getElementById('p_from').value;
    const to = document.getElementById('p_to').value || todayStr();
    if(!from) return;
    historyPeriod = { type:'custom', from, to };
    document.querySelectorAll('#periodFilters .chip').forEach(c=>c.classList.remove('active'));
    const customChip = document.querySelector('#periodFilters .chip[data-p="custom"]');
    if(customChip){ customChip.classList.add('active'); customChip.textContent = from + ' — ' + to; }
    closeSheet(); renderHistory();
  }

  if(action==='saveAccount'){
    const name = document.getElementById('f_name').value.trim() || 'Новый счёт';
    const type = document.getElementById('f_type').value;
    const balance = parseFloat(document.getElementById('f_balance').value) || 0;
    const newAcc = {id:uid(), name, type, balance};
    state.accounts.push(newAcc);
    state.settings.activeAccountId = newAcc.id;
    saveState(state); closeSheet(); renderAccounts(); renderHome();
  }

  if(action==='saveCategory'){
    const name = document.getElementById('cat_name').value.trim();
    const type = document.getElementById('cat_type').value;
    if(!name) return;
    const id = uid();
    state.categories.push({id, name, type});
    if(type===ui.mode) ui.categoryId = id;
    saveState(state); closeSheet(); renderHome();
  }

  if(action==='saveRule'){
    const note = document.getElementById('r_note').value.trim();
    const type = document.getElementById('r_type').value;
    const categoryId = document.getElementById('r_cat').value;
    const accountId = document.getElementById('r_acc').value;
    const amount = parseFloat(document.getElementById('r_amount').value) || 0;
    const frequency = document.getElementById('r_freq').value;
    const interval = parseInt(document.getElementById('r_interval').value) || 1;
    const startDate = document.getElementById('r_start').value || todayStr();
    const autoApply = document.getElementById('r_auto').checked;
    if(amount<=0) return;
    state.recurringRules.push({
      id:uid(), type, categoryId, accountId, amount, note,
      frequency, interval, startDate, nextDate:startDate, autoApply, active:true
    });
    saveState(state); closeSheet(); renderRecurring();
  }

  if(action==='exportData'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'finance-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  if(action==='importData'){
    document.getElementById('importFile').click();
  }

  if(action==='applySettings'){
    state.settings.theme = document.getElementById('s_dark').checked ? 'dark' : 'light';
    state.settings.style = document.getElementById('s_eink').checked ? 'eink' : 'receipt';
    saveState(state); applyTheme(); closeSheet();
  }
});
document.addEventListener('change', e=>{
  if(e.target.id !== 'importFile') return;
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.accounts && data.transactions){
        state = data; saveState(state); applyTheme();
        closeSheet(); showScreen('home');
        alert('Данные импортированы');
      } else { alert('Файл не похож на бэкап этого приложения'); }
    }catch(err){ alert('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
});

/* ---------- theme ---------- */
function applyTheme(){
  document.body.classList.toggle('dark', state.settings.theme==='dark');
  document.body.classList.toggle('eink', state.settings.style==='eink');
}

/* ---------- init ---------- */
applyTheme();
renderHome();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      reg.update();
      setInterval(()=> reg.update(), 60*1000);
    }).catch(()=>{});
  });
  let refreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshedOnce) return;
    refreshedOnce = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
